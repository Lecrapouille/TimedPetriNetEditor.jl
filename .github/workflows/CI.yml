name: CI
on:
  push:
    branches:
      - master
      - main
    tags: ['*']
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.native && ' (native)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            native: true
          - version: '1'
            os: ubuntu-latest
            arch: x64
            native: true
          - version: '1.10'
            os: macOS-latest
            arch: x64
            native: false
          - version: '1.10'
            os: windows-latest
            arch: x64
            native: false
    steps:
      - uses: actions/checkout@v4
      - name: Checkout C++ TimedPetriNetEditor
        if: matrix.native
        uses: actions/checkout@v4
        with:
          repository: Lecrapouille/TimedPetriNetEditor
          path: TimedPetriNetEditor
          submodules: recursive
      - name: Install Linux build dependencies
        if: matrix.native && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git \
            libzmq3-dev libglfw3-dev libglew-dev
      - name: Set TPNE_CPP_DIR
        if: matrix.native
        run: echo "TPNE_CPP_DIR=${{ github.workspace }}/TimedPetriNetEditor" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.10'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using TimedPetriNetEditor
            doctest(TimedPetriNetEditor)'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
